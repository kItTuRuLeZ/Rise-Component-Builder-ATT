    :root, .rise-block-wrapper {

      --primary: #00388F;
      --accent: #009FDB;
      --primary-hover: #002A6B;
      --bg-body: #FFFFFF;
      --bg-card: #FFFFFF;
      --text-main: #000000;
      --text-muted: #4B5563;
      --border-color: #DCDFE3;
      --border-radius: 12px;
      --button-radius: 20px;
      --border-style: 1px solid var(--border-color);
      --shadow-style: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      --font-family: 'ATT Aleck Sans', sans-serif;
      --heading-font-family: 'ATT Aleck Sans', sans-serif;
      --spacing-scale: 1;
      --animation-speed: 200ms;
      --primary-light: rgba(0, 56, 143, 0.12);
      --primary-tint: rgba(0, 56, 143, 0.05);
      --focus-ring: rgba(0, 56, 143, 0.16);
      --accent-light: rgba(0, 159, 219, 0.14);
      --accent-tint: rgba(0, 159, 219, 0.07);
      --success: #91DC00;
      --warning: #00388F;
      --danger: #00388F;
      --success-tint: rgba(145, 220, 0, 0.1);
      --danger-tint: rgba(0, 56, 143, 0.1);
      --on-primary: #FFFFFF;
      --on-accent: #FFFFFF;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
      --component-max-width: 740px;

      /* AT&T brand token layer (js/att-tokens.js ← design/att-tokens.css). Present in
         every artifact; not yet consumed by component CSS — the color/type/curvature
         passes wire it in. Theme tokens above stay the active layer for now. */
  /* Primary — AT&T Blue must be dominant wherever possible */
  --att-blue: #009FDB;
  --att-white: #FFFFFF;

  /* Secondary — support only; never out-weigh AT&T Blue. Cobalt is the CTA color. */
  --att-cobalt: #00388F;
  --att-mint: #49EEDC;
  --att-lime: #91DC00;

  /* Neutrals */
  --att-grey-1: #F3F4F5;
  --att-grey-2: #DCDFE3;
  --att-grey-3: #BDC2C7;
  --att-black: #000000;

  /* AT&T Blue gradient — limited use, full ramp only, never partial, never re-authored */
  --att-blue-dark: #0079B1;   /* 15% darker */
  --att-blue-light: #00C9FF;  /* 15% lighter */
  --att-gradient: linear-gradient(90deg, #0079B1 0%, #009FDB 50%, #00C9FF 100%);

  /* Semantic roles (derived only from the values above) */
  --att-text: #000000;
  --att-text-on-dark: #FFFFFF;
  --att-heading: #009FDB;        /* preferred headline color */
  --att-heading-contrast: #000000;
  --att-surface: #FFFFFF;
  --att-surface-sunken: #F3F4F5;
  --att-border: #DCDFE3;
  --att-border-strong: #BDC2C7;
  --att-focus: #00388F;
  --att-cta-bg: #00388F;
  --att-cta-fg: #FFFFFF;
  --att-cta-bg-hover: #002A6B;   /* Cobalt darkened for state only — not a new brand color */

  /* Type */
  --att-font-sans: "ATT Aleck Sans", "AT&T Aleck Sans", Helvetica, Arial, sans-serif;
  --att-font-cd: "ATT Aleck Cd", "ATT Aleck Sans", Helvetica, Arial, sans-serif;
  --att-font-slab: "ATT Aleck Slab", Georgia, serif;

  --att-w-light: 300;
  --att-w-regular: 400;
  --att-w-medium: 500;
  --att-w-bold: 700;
  --att-w-black: 900;

  /* Type scale — component scale, 16px body floor for learner-facing text */
  --att-fs-eyebrow: 0.75rem;   /* 12px, uppercase, letterspaced label */
  --att-fs-body-sm: 0.875rem;  /* 14px — metadata only, never body copy */
  --att-fs-body: 1rem;         /* 16px */
  --att-fs-body-lg: 1.125rem;  /* 18px */
  --att-fs-h4: 1.25rem;
  --att-fs-h3: 1.5rem;
  --att-fs-h2: 1.875rem;
  --att-fs-h1: 2.5rem;

  --att-lh-tight: 1.15;
  --att-lh-heading: 1.25;
  --att-lh-body: 1.5;
  --att-ls-eyebrow: 0.08em;

  /* Spacing — 4px base */
  --att-space-1: 4px;
  --att-space-2: 8px;
  --att-space-3: 12px;
  --att-space-4: 16px;
  --att-space-5: 24px;
  --att-space-6: 32px;
  --att-space-7: 48px;
  --att-space-8: 64px;

  /* Curvature — rounded rectangles are the brand's long-form/digital curvature asset.
     Radius scales with container size so corners read consistently. */
  --att-radius-sm: 8px;    /* chips, badges, inputs */
  --att-radius-md: 12px;   /* buttons, small cards */
  --att-radius-lg: 20px;   /* content cards, accordion rows */
  --att-radius-xl: 32px;   /* full-width block shells */
  --att-radius-pill: 999px;

  /* Elevation — restrained; brand leans on curvature and color, not shadow */
  --att-shadow-1: 0 1px 2px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04);

    // messages the brief asked for map onto the three configured levels without a fifth,
    // undocumented in-between message.
    function getConfidenceInterpretation(isCorrect, confidence) {
      var high = confidence === 'high';
      if (isCorrect && high) return 'This suggests solid, secure understanding of this concept.';
      if (isCorrect && !high) return 'Correct — reviewing this again may help reinforce it further.';
      if (!isCorrect && high) return 'This may point to a misconception worth revisiting.';
      return 'This looks like a learning gap — worth reviewing further.';
    }

    function revealCorrectOption() {
      document.querySelectorAll('.quiz-option').forEach(function(el) {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var flag = el.querySelector('.option-correct-flag');
        if (flag && quizOptions[idx] && quizOptions[idx].correct) flag.hidden = false;
      });
    }

    function concludeQuiz(wasCorrect) {
      quizConcluded = true;
      document.querySelectorAll('.quiz-option, .quiz-confidence-option').forEach(function(el) {
        el.setAttribute('aria-disabled', 'true');
        el.setAttribute('tabindex', '-1');
      });
      var submitBtn = document.querySelector('.quiz-submit-btn');
      if (submitBtn) submitBtn.setAttribute('aria-disabled', 'true');
      var resetBtn = document.querySelector('.quiz-reset-btn');
      if (resetBtn && !wasCorrect) resetBtn.hidden = false;
    }

    function submitQuiz() {
      if (quizConcluded) return;
      var feedback = document.getElementById('rcb-fixture-multiple-choice-quiz-feedback-box');
      var hint = document.getElementById('rcb-fixture-multiple-choice-quiz-hint');

      if (selectedOptionIndex === null) {
        feedback.style.display = 'block';
        feedback.className = 'quiz-feedback wrong';
        feedback.innerHTML = '<strong>Select an option first.</strong>';
        feedback.focus();
        return;
      }
      if (requireConfidence && !selectedConfidence) {
        feedback.style.display = 'block';
        feedback.className = 'quiz-feedback wrong';
        feedback.innerHTML = '<strong>Select a confidence level first.</strong>';
        feedback.focus();
        return;
      }

      var selection = quizOptions[selectedOptionIndex];
      var isCorrect = selection.correct;
      attemptsUsed++;

      feedback.style.display = 'block';
      feedback.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');

      if (isCorrect) {
        feedback.innerHTML = '<strong>Correct!</strong> ' + (selection.content || 'Excellent choices.');
        if (confidenceMode && showResultSummary) {
          feedback.innerHTML += '<span class="quiz-feedback-interpretation">' + getConfidenceInterpretation(true, selectedConfidence) + '</span>';
        }
        if (finalExplanationHtml) {
          feedback.innerHTML += '<span class="quiz-feedback-explanation">' + finalExplanationHtml + '</span>';
        }
        if (hint) hint.hidden = true;
        concludeQuiz(true);
        updateTrackerComplete();
      } else if (attemptsUsed < maxAttempts) {
        var remaining = maxAttempts - attemptsUsed;
        feedback.innerHTML = '<strong>Incorrect.</strong> ' + remaining + ' attempt' + (remaining === 1 ? '' : 's') + ' remaining.';
        if (hint && hint.textContent.trim()) hint.hidden = false;
        selectedOptionIndex = null;
        selectedConfidence = null;
        document.querySelectorAll('.quiz-option').forEach(function(el, idx) {
          el.classList.remove('selected');
          el.setAttribute('aria-checked', 'false');
          el.setAttribute('tabindex', idx === 0 ? '0' : '-1');
        });
        document.querySelectorAll('.quiz-confidence-option').forEach(function(el, idx) {
          el.classList.remove('selected');
          el.setAttribute('aria-checked', 'false');
          el.setAttribute('tabindex', idx === 0 ? '0' : '-1');
        });
      } else {
        feedback.innerHTML = '<strong>Incorrect.</strong> Try reviewing the source documentation again.';
        if (confidenceMode && showResultSummary) {
          feedback.innerHTML += '<span class="quiz-feedback-interpretation">' + getConfidenceInterpretation(false, selectedConfidence) + '</span>';
        }
        if (finalExplanationHtml) {
          feedback.innerHTML += '<span class="quiz-feedback-explanation">' + finalExplanationHtml + '</span>';
        }
        if (hint) hint.hidden = true;
        if (showCorrectAfterFinal) revealCorrectOption();
        concludeQuiz();
      }

      feedback.focus();
    }

    function resetQuiz() {
      quizConcluded = false;
      selectedOptionIndex = null;
      selectedConfidence = null;
      attemptsUsed = 0;

      document.querySelectorAll('.quiz-option').forEach(function(el, idx) {
        el.classList.remove('selected');
        el.setAttribute('aria-checked', 'false');
        el.removeAttribute('aria-disabled');
        el.setAttribute('tabindex', idx === 0 ? '0' : '-1');
        var flag = el.querySelector('.option-correct-flag');
        if (flag) flag.hidden = true;
      });
      document.querySelectorAll('.quiz-confidence-option').forEach(function(el, idx) {
        el.classList.remove('selected');
        el.setAttribute('aria-checked', 'false');
        el.removeAttribute('aria-disabled');
        el.setAttribute('tabindex', idx === 0 ? '0' : '-1');
      });
      var submitBtn = document.querySelector('.quiz-submit-btn');
      if (submitBtn) submitBtn.removeAttribute('aria-disabled');
      var resetBtn = document.querySelector('.quiz-reset-btn');
      if (resetBtn) resetBtn.hidden = true;
      var hint = document.getElementById('rcb-fixture-multiple-choice-quiz-hint');
      if (hint) hint.hidden = true;
      var feedback = document.getElementById('rcb-fixture-multiple-choice-quiz-feedback-box');
      if (feedback) { feedback.style.display = 'none'; feedback.innerHTML = ''; }

      var firstOption = document.querySelector('.quiz-option');
      if (firstOption) firstOption.focus();
      announce('Question reset.');
    }

    function initComponent() {
      document.querySelectorAll('.quiz-option[role="radio"]').forEach(function(option) {
        option.addEventListener('click', function() {
          selectQuizOption(parseInt(option.getAttribute('data-idx'), 10), option);
        });
        option.addEventListener('keydown', function(event) {
          if (quizConcluded) return;
          var options = Array.from(document.querySelectorAll('.quiz-option[role="radio"]'));
          var current = options.indexOf(option);
          var next = current;
          if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (current + 1) % options.length;
          else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (current - 1 + options.length) % options.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = options.length - 1;
          else if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            selectQuizOption(current, option);
            return;
          } else return;
          event.preventDefault();
          selectQuizOption(next, options[next]);
          options[next].focus();
        });
      });

      document.querySelectorAll('.quiz-confidence-option[role="radio"]').forEach(function(option) {
        option.addEventListener('click', function() {
          selectConfidence(option.getAttribute('data-confidence'), option);
        });
        option.addEventListener('keydown', function(event) {
          if (quizConcluded) return;
          var options = Array.from(document.querySelectorAll('.quiz-confidence-option[role="radio"]'));
          var current = options.indexOf(option);
          var next = current;
          if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (current + 1) % options.length;
          else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (current - 1 + options.length) % options.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = options.length - 1;
          else if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            selectConfidence(option.getAttribute('data-confidence'), option);
            return;
          } else return;
          event.preventDefault();
          selectConfidence(options[next].getAttribute('data-confidence'), options[next]);
          options[next].focus();
        });
      });

      var quizSubmitBtn = document.querySelector('.quiz-submit-btn');
      if (quizSubmitBtn) quizSubmitBtn.addEventListener('click', submitQuiz);
      var quizResetBtn = document.querySelector('.quiz-reset-btn');
      if (quizResetBtn) quizResetBtn.addEventListener('click', resetQuiz);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initComponent);
    } else {
      initComponent();
    }
    })();
  </script>
</body>
</html>
